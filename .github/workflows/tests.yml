name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]

    name: PHP 8.5 / Laravel 13 / ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laravel_admin_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laravel_admin_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, fileinfo, gd, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: find src database config tests -name '*.php' -print0 | xargs -0 -n1 php -d error_reporting=-1 -l | grep -v '^No syntax errors' && exit 1 || true

      - name: Execute tests
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: ${{ matrix.database }}
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          PGSQL_HOST: 127.0.0.1
          PGSQL_USER: postgres
          PGSQL_PASSWORD: secret
